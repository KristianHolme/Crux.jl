name: CI

# Run on master, tags, or any pull request
on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:  # Enables manual triggering

jobs:
  # unit tests with coverage
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # - "1.9"
          # - "1.10"
          - "1"
        os:
          - ubuntu-latest
          # - windows-latest
        arch:
          - x64
    steps:
      # # install CUDA
      # - uses: Jimver/cuda-toolkit@v0.2.4
      #   id: cuda-toolkit
      #   with:
      #     cuda: '11.2.2'

      # check out the project and install Julia
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # Set up Python 3.10
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # Get Python location and install packages
      - run: |
          echo "PYTHON=$(which python)" >> $GITHUB_ENV
          python -m pip install gym wandb
      
      # Configure PyCall to use Python 3.10
      - run: julia --color=yes -e 'using Pkg; ENV["PYTHON"]="${{ env.PYTHON }}"; Pkg.build("PyCall")'
      
      # Now install POMDPGym and configure PyCall
      - run: julia --color=yes --project -e 'using Pkg; ENV["PYTHON"]="${{ env.PYTHON }}"; Pkg.add("PyCall"); Pkg.build("PyCall"); pkg"add https://github.com/ancorso/POMDPGym.jl"; Pkg.instantiate()'
      # using a cache can speed up execution times
      - uses: actions/cache@v3
        env:
          cache-name: cache-artifacts
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/packages
            ~/.julia/registries
          key: ${{ runner.os }}-${{ matrix.arch }}-julia-${{ matrix.version }}-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-julia-${{ matrix.version }}-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.arch }}-julia-${{ matrix.version }}-
            ${{ runner.os }}-${{ matrix.arch }}-

      # build the depencies, run the tests, and upload coverage results
      - uses: julia-actions/julia-buildpkg@v1
      - run: |
          git config --global user.name Tester
          git config --global user.email te@st.er
      - name: Run Tests
        uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v3
        with:
          file: ./lcov.info
          flags: unittests
          name: codecov-umbrella